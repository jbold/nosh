[package]
name = "nosh"
version = "0.1.0"
edition = "2021"
description = "Validator CLI for the Nosh specification — structured companion files for AI agents"
license = "MIT"
rust-version = "1.83"

[[bin]]
name = "nosh"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
jsonschema = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
